<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">ESXi NPI lab topology</title>
  <desc id="d">A laptop running Nobara Linux and VMware Workstation hosts a nested ESXi 8.0 U3 VM with 4 vCPUs and 8 GB RAM. Its network adapter is bridged through vmnet0 to the physical NIC, so the ESXi management interface vmk0 gets 192.168.10.41 from the home router at 192.168.10.1, which also gives DNS. Any browser on the LAN reaches the ESXi Host Client. Inside ESXi, vSwitch0 and the VM Network port group connect two guests: RHEL 10.1 (2 vCPU, 2 GB, 10 GB disk) and Windows Server 2022 (2 vCPU, 4 GB, 54 GB disk). datastore1 (VMFS6, 13.75 GB) holds the ESXi system; datastore2 (VMFS6, 100 GB) holds the VM disks.</desc>
  <style>
    :root { --ink:#1f2937; --sub:#57606a; --line:#d0d7de; --card:#ffffff; --on:#0e7490; --tint:#ecfeff; --group:#f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6edf3; --sub:#9198a1; --line:#3d444d; --card:#161b22; --on:#22d3ee; --tint:#0b2a30; --group:#0d1117; }
    }
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .lane  { font-size:11.5px; font-weight:700; fill:var(--sub); letter-spacing:.06em; }
    .title { font-size:13.5px; font-weight:700; fill:var(--ink); text-anchor:middle; }
    .sub   { font-size:10.5px; fill:var(--sub); text-anchor:middle; }
    .lbl   { font-size:10.5px; fill:var(--sub); }
    .node  { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
    .hot   { fill:var(--tint); stroke:var(--on); stroke-width:1.5; }
    .db    { fill:var(--tint); stroke:var(--line); stroke-width:1.5; }
    .group { fill:var(--group); stroke:var(--line); stroke-width:1.5; stroke-dasharray:5 4; }
    .inner { fill:var(--card); stroke:var(--line); stroke-width:1.5; stroke-dasharray:5 4; }
    .wire  { stroke:var(--line); stroke-width:1.5; fill:none; }
    .path  { stroke:var(--on); stroke-width:2; fill:none; }
    .head  { fill:var(--line); }
    .headon{ fill:var(--on); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0 L10 5 L0 10z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="headon" d="M0 0 L10 5 L0 10z"/></marker>
  </defs>

  <!-- LAN side -->
  <text class="lane" x="20" y="46">HOME LAN</text>
  <text class="lbl" x="20" y="62">192.168.10.0/24</text>
  <rect class="node" x="20" y="150" width="175" height="76" rx="10"/>
  <text class="title" x="107.5" y="180">Home router</text>
  <text class="sub" x="107.5" y="198">192.168.10.1</text>
  <text class="sub" x="107.5" y="213">gateway · DHCP · DNS</text>
  <rect class="node" x="20" y="276" width="175" height="66" rx="10"/>
  <text class="title" x="107.5" y="304">Browser on the LAN</text>
  <text class="sub" x="107.5" y="322">https://192.168.10.41</text>
  <path class="wire" d="M107.5 276 V228" marker-end="url(#a)"/>

  <!-- Laptop host -->
  <rect class="group" x="225" y="20" width="715" height="362" rx="12"/>
  <text class="lane" x="243" y="44">LAPTOP · NOBARA LINUX · VMWARE WORKSTATION</text>
  <text class="lbl" x="243" y="60">AMD Ryzen AI 9 365</text>

  <rect class="hot" x="243" y="150" width="150" height="76" rx="10"/>
  <text class="title" x="318" y="180">vmnet0 (bridged)</text>
  <text class="sub" x="318" y="198">bound to the</text>
  <text class="sub" x="318" y="213">physical NIC</text>
  <path class="path" d="M195 188 H241" marker-end="url(#b)"/>
  <text class="lbl" x="200" y="180">LAN</text>

  <!-- Nested ESXi -->
  <rect class="inner" x="418" y="76" width="506" height="292" rx="12"/>
  <text class="lane" x="434" y="98">NESTED ESXi 8.0 U3 VM · 4 vCPU · 8 GB</text>

  <rect class="hot" x="434" y="114" width="150" height="66" rx="10"/>
  <text class="title" x="509" y="141">vmk0 + Host Client</text>
  <text class="sub" x="509" y="159">192.168.10.41/24 (DHCP)</text>

  <rect class="node" x="434" y="200" width="150" height="66" rx="10"/>
  <text class="title" x="509" y="227">vSwitch0</text>
  <text class="sub" x="509" y="245">"VM Network" port group</text>

  <path class="path" d="M393 180 H412 V147 H432" marker-end="url(#b)"/>
  <path class="wire" d="M393 196 H412 V233 H432" marker-end="url(#a)"/>

  <rect class="node" x="604" y="114" width="140" height="66" rx="10"/>
  <text class="title" x="674" y="141">RHEL 10.1</text>
  <text class="sub" x="674" y="159">2 vCPU · 2 GB · 10 GB</text>
  <rect class="node" x="756" y="114" width="156" height="66" rx="10"/>
  <text class="title" x="834" y="141">Windows Server 2022</text>
  <text class="sub" x="834" y="159">2 vCPU · 4 GB · 54 GB</text>

  <path class="wire" d="M584 233 H834 V182" marker-end="url(#a)"/>
  <path class="wire" d="M674 233 V182" marker-end="url(#a)"/>

  <rect class="db" x="604" y="282" width="140" height="66" rx="10"/>
  <text class="title" x="674" y="309">datastore1</text>
  <text class="sub" x="674" y="327">VMFS6 · 13.75 GB · ESXi</text>
  <rect class="db" x="756" y="282" width="156" height="66" rx="10"/>
  <text class="title" x="834" y="309">datastore2</text>
  <text class="sub" x="834" y="327">VMFS6 · 100 GB · VM disks</text>
  <text class="lbl" x="434" y="312">Storage: two virtual</text>
  <text class="lbl" x="434" y="327">disks from Workstation</text>
</svg>
